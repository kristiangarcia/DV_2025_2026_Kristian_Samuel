# ═══════════════════════════════════════════════════════════════════════════════
# CONFIGURACIÓN DE ENTRENAMIENTO – StatueAgent ("La Estatua Acechadora")
# DAV - 2ºDAM  ·  v2 – Basada en investigación de mejores prácticas PPO 2025
#
# Cambios respecto a v1:
#   · batch_size   128  → 1024   (rango óptimo para acciones continuas: 512-5120)
#   · buffer_size  2048 → 10240  (10x batch_size para estabilidad con 9 instancias)
#   · beta         5e-3 → 1e-3   (menos entropía: "quieto" converge más fácil)
#   · num_epoch    3    → 4      (buffer más grande → más aprovechamiento por ciclo)
#   · gamma        0.99 → 0.995  (horizonte largo para MaxStep=5000)
#   · time_horizon 64   → 512    (debe cubrir secuencias de persecución completas)
#   · max_steps    500K → 3M     (mecánica condicional compleja necesita más pasos)
#   · Space Size   7    → 12     (nuevas obs: velocidad propia, dist. norm., alineación)
#
# USO (desde el contenedor Docker en /Users/kristian/Downloads/mlagents_ver1102/):
#   mlagents-learn Assets/ML-Agents/Config/estatua_config.yaml --run-id=Estatua_v2
#
# TENSORBOARD:
#   tensorboard --logdir results
# ═══════════════════════════════════════════════════════════════════════════════

behaviors:
  StatueAgent:
    trainer_type: ppo

    hyperparameters:
      # Para acciones continuas, rango oficial ML-Agents: 512-5120.
      # Con 9 instancias y time_horizon=512 → ~4608 muestras/ciclo → batch de 1024.
      batch_size: 1024

      # 10x batch_size. Cubre ~2 ciclos completos antes de actualizar.
      buffer_size: 10240

      learning_rate: 3.0e-4

      # Reducido de 5e-3: menos entropía para que "quedarse quieto cuando es visto"
      # converja sin que la aleatoriedad interfiera.
      beta: 1.0e-3

      epsilon: 0.2
      lambd: 0.95

      # Buffer más grande permite más pasadas sin sobreajuste.
      num_epoch: 4

      learning_rate_schedule: linear

    network_settings:
      normalize: true        # Obligatorio: obs mixtas (floats, binarios, vectores)
      hidden_units: 128      # Suficiente para 12 obs y 2 acciones
      num_layers: 2

    reward_signals:
      extrinsic:
        # 0.995 en vez de 0.99: con MaxStep=5000 el agente necesita valorar
        # recompensas muy futuras (llegar en step 100 vs step 4900).
        gamma: 0.995
        strength: 1.0

    # 3M steps: la mecánica condicional ("muévete solo cuando no eres visto")
    # necesita ~6x más pasos que un perseguidor simple (FoodCollector usa 2M).
    max_steps: 3000000

    # 512 = ~10% del episodio. Captura secuencias de persecución completas.
    # Era 64 = 1.28% del episodio → el agente no veía la correlación orbitar→no llegar.
    time_horizon: 512

    summary_freq: 10000
    keep_checkpoints: 5
    checkpoint_interval: 100000
