# ═══════════════════════════════════════════════════════════════════════════════
# CONFIGURACIÓN DE ENTRENAMIENTO – StatueAgent ("La Estatua Acechadora")
# DAV - 2ºDAM
#
# Algoritmo: PPO (Proximal Policy Optimization)
#   → Ideal para mecánicas con recompensas densas y comportamiento continuo.
#   → Estable y probado para los ejemplos de este proyecto.
#
# USO (desde el contenedor Docker en /Users/kristian/Downloads/mlagents_ver1102/):
#   mlagents-learn Assets/ML-Agents/Config/estatua_config.yaml --run-id=Estatua_v1
#
# TENSORBOARD (para monitorizar el entrenamiento):
#   tensorboard --logdir results
# ═══════════════════════════════════════════════════════════════════════════════

behaviors:
  StatueAgent:  # Debe coincidir EXACTAMENTE con el campo "Behavior Name" del BehaviorParameters
    trainer_type: ppo

    hyperparameters:
      # batch_size: Muestras por mini-batch al actualizar la red.
      #   → Más pequeño = actualizaciones más frecuentes y ruidosas.
      #   → Recomendado para acciones continuas: 64-512.
      batch_size: 128

      # buffer_size: Experiencias acumuladas antes de hacer una actualización.
      #   → Debe ser múltiplo de batch_size. Relación estándar: 16-32x batch_size.
      buffer_size: 2048

      # learning_rate: Paso de aprendizaje del optimizador Adam.
      #   → Si la recompensa no converge: bajar a 1e-4.
      #   → Si converge demasiado lento: subir a 5e-4 con cuidado.
      learning_rate: 3.0e-4

      # beta: Coeficiente de entropía. Penaliza la certeza excesiva → fomenta exploración.
      #   → Si el agente queda "paralizado" explorando: bajar a 1e-3.
      #   → Si converge prematuramente sin aprender la mecánica: subir a 1e-2.
      beta: 5.0e-3

      # epsilon: Clip ratio de PPO. Limita el cambio de política por iteración.
      #   → 0.2 es el valor estándar. Rango recomendado: 0.1 – 0.3.
      epsilon: 0.2

      # lambd: Factor lambda para GAE (Generalized Advantage Estimation).
      #   → Equilibrio entre sesgo y varianza en el cálculo de ventajas.
      #   → 0.95 es el estándar. Bajar a 0.9 si hay mucha varianza.
      lambd: 0.95

      # num_epoch: Pasadas sobre el buffer por actualización.
      #   → Más épocas = más uso de cada batch de datos.
      #   → 3 es un buen equilibrio para evitar sobreajuste.
      num_epoch: 3

      # learning_rate_schedule: Decaimiento del learning rate.
      #   · linear: decae de 3e-4 → 0 a lo largo del entrenamiento (recomendado).
      #   · constant: no decae.
      learning_rate_schedule: linear

    network_settings:
      # normalize: Normaliza las observaciones de entrada.
      #   → MUY IMPORTANTE activar cuando las observaciones son floats mixtos
      #      (posiciones normalizadas, 0/1 binario, vectores de dirección).
      normalize: true

      # hidden_units: Neuronas por capa oculta.
      #   → 128 es suficiente para 7 observaciones y 2 acciones.
      #   → Si no converge: probar 256. Si entrena lento: probar 64.
      hidden_units: 128

      # num_layers: Capas ocultas de la red neuronal.
      #   → 2 capas es el estándar para comportamientos de complejidad media.
      num_layers: 2

    reward_signals:
      extrinsic:
        # gamma: Factor de descuento. Cuánto "vale" una recompensa futura.
        #   → 0.99 = horizonte largo (el agente piensa a futuro).
        #   → Para episodios cortos (<500 pasos): bajar a 0.95-0.97.
        gamma: 0.99
        strength: 1.0

    # max_steps: Pasos TOTALES de entrenamiento en todas las instancias combinadas.
    #   → 500K para aprendizaje inicial de la mecánica básica.
    #   → 1M-2M para refinamiento y comportamiento más sofisticado.
    max_steps: 500000

    # time_horizon: Pasos antes de calcular el retorno (mini-episodio interno).
    #   → Debe ser <= longitud media de episodio.
    #   → Con MaxStep=5000 y comportamiento mixto: 64-128 es razonable.
    time_horizon: 64

    # summary_freq: Cada cuántos pasos se escribe una entrada en TensorBoard.
    summary_freq: 10000

    # keep_checkpoints: Checkpoints máximos guardados en disco.
    keep_checkpoints: 5

    # checkpoint_interval: Guardar checkpoint cada N pasos.
    checkpoint_interval: 50000
